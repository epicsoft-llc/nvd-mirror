# NVD datafeed mirror: vulnz fetches the NVD changes daily, GitLab Pages serves the files at
# https://nvd.epicsoft.one, then the dependencycheck pipeline is triggered.
# GitLab Pages publishes the 'public/' artifact of the job named 'pages'.
#
# CI/CD variables:
#   NVD_API_KEY   NVD API key (masked)
#   SEED_VERSION  full rebuild only: seed from the package registry (see seed-upload.sh)

stages:
  - deploy
  - verify
  - trigger

pages:
  stage: deploy
  image:
    name: ghcr.io/jeremylong/open-vulnerability-data-mirror:latest
    entrypoint: [""]
  # Daily runs take minutes; the limit leaves room for vulnz's retries against a slow NVD API.
  timeout: 3h
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
  # One run at a time: parallel runs would fetch the same NVD changes and race for the Pages deployment.
  resource_group: pages
  # No CI cache: the runner names its cache server in the job log, and the logs are public.
  variables:
    # Published mirror: every run seeds from it, then vulnz only fetches the changes.
    MIRROR_BASE: "https://nvd.epicsoft.one"
    # Must be absolute: vulnz resolves a relative --directory against /usr/local/bin.
    CACHE_DIR: "${CI_PROJECT_DIR}/nvd-cache"
    # vulnz reads JAVA_OPTS (the image entrypoint is bypassed); the default heap is too small.
    JAVA_OPTS: "-Xmx3277m -XX:+UseStringDeduplication"
    # Log every NVD request (vulnz only, Spring stays at INFO).
    LOGGING_LEVEL_IO_GITHUB_JEREMYLONG: "DEBUG"
  before_script:
    # The image is only rebuilt with vulnz releases; the upgrade brings the security fixes since then.
    - apk --no-cache upgrade
    # --retry-all-errors needs curl >= 7.71.
    - |
      if curl --help all 2>/dev/null | grep -q -- --retry-all-errors; then
        CURL_RETRY="--retry 3 --retry-delay 2 --retry-all-errors"
      else
        CURL_RETRY="--retry 3 --retry-delay 2"
      fi
    # fetch <url> <dest>: removes the partial file on failure; AUTH_HEADER goes to curl over stdin.
    - |
      fetch() {
        if [ -n "${AUTH_HEADER:-}" ]; then
          printf '%s\n' "$AUTH_HEADER" | curl -fsSL $CURL_RETRY --header @- "$1" -o "$2"
        else
          curl -fsSL $CURL_RETRY "$1" -o "$2"
        fi || { rm -f "$2"; return 1; }
      }
    # seed_from <base-url> <label>: fill $CACHE_DIR so vulnz only fetches changes.
    # All or nothing: vulnz never re-downloads a year listed in cache.properties, so a seed that
    # misses one year would drop it from the mirror for good.
    - |
      seed_from() {
        base="$1"; label="$2"
        if ! fetch "$base/cache.properties" "$CACHE_DIR/cache.properties"; then
          echo "no cache.properties at $label"
          return 1
        fi
        years="$(sed -n 's/^lastModifiedDate\.\([0-9A-Za-z]*\)=.*/\1/p' "$CACHE_DIR/cache.properties")"
        if [ -z "$years" ]; then
          echo "cache.properties from $label lists no feeds"
          rm -f "$CACHE_DIR/cache.properties"
          return 1
        fi
        for y in $years; do
          if ! fetch "$base/nvdcve-${y}.json.gz" "$CACHE_DIR/nvdcve-${y}.json.gz"; then
            echo "incomplete seed from $label (nvdcve-${y}.json.gz missing) -> discarding it"
            rm -f "$CACHE_DIR"/cache.properties "$CACHE_DIR"/nvdcve-*.json.gz "$CACHE_DIR"/nvdcve-*.meta
            return 1
          fi
          # .meta is optional.
          fetch "$base/nvdcve-${y}.meta" "$CACHE_DIR/nvdcve-${y}.meta" || true
        done
        echo "seeded $(ls "$CACHE_DIR"/nvdcve-*.json.gz | wc -l) feed files from $label"
      }
  script:
    - mkdir -p "$CACHE_DIR" public
    # Full rebuild only: seed from the package registry (CI variable SEED_VERSION, see seed-upload.sh).
    - |
      if [ -n "${SEED_VERSION:-}" ]; then
        echo "seeding from the package registry (nvd-seed/$SEED_VERSION)"
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
        seed_from "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/nvd-seed/${SEED_VERSION}" \
                  "package registry nvd-seed/$SEED_VERSION" || true
        unset AUTH_HEADER
      fi
    # Without a seed vulnz would start a full NVD download, which does not fit the runner: stop instead.
    - |
      if [ ! -f "$CACHE_DIR/cache.properties" ]; then
        echo "seeding $CACHE_DIR from $MIRROR_BASE"
        seed_from "$MIRROR_BASE" "$MIRROR_BASE" || {
          echo "ERROR: seeding from $MIRROR_BASE failed -> nothing published (feed gone for good: README, Full rebuild)" >&2
          exit 1
        }
      fi
    # Fetches only the changes since the last run.
    - vulnz cve --cache --directory "$CACHE_DIR" --delay 6000 --maxRetry 50
    # Never publish a gap: every year in cache.properties must be a valid gzip file.
    - |
      broken=0
      for y in $(sed -n 's/^lastModifiedDate\.\([0-9A-Za-z]*\)=.*/\1/p' "$CACHE_DIR/cache.properties"); do
        f="$CACHE_DIR/nvdcve-${y}.json.gz"
        if [ ! -s "$f" ]; then
          echo "ERROR: $f is missing or empty" >&2
          broken=$((broken + 1))
        elif ! gzip -t "$f" 2>/dev/null; then
          echo "ERROR: $f is not a valid gzip file" >&2
          broken=$((broken + 1))
        fi
      done
      [ "$broken" -eq 0 ] || { echo "ERROR: $broken feed file(s) unusable -> refusing to publish" >&2; exit 1; }
      echo "verified $(ls "$CACHE_DIR"/nvdcve-*.json.gz | wc -l) feed files"
    - cp "$CACHE_DIR"/nvdcve-*.json.gz public/
    - cp "$CACHE_DIR/cache.properties" public/
    - cp "$CACHE_DIR"/*.meta public/ 2>/dev/null || true
    # Publish time on the landing page.
    - |
      if ! grep -q '@LAST_UPDATE@' public/index.html; then
        echo "ERROR: the @LAST_UPDATE@ placeholder is gone from public/index.html" >&2
        exit 1
      fi
      sed -i "s|@LAST_UPDATE@|$(date -u '+%Y-%m-%d %H:%M')|" public/index.html
  artifacts:
    paths:
      - public
    # Older artifacts expire; the latest is kept ("Keep latest artifacts" is on).
    expire_in: 2 days
  tags: [ "epicsoft" ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Pages deploys asynchronously; the consumer may only start once the new files are live.
verify-published:
  stage: verify
  image:
    name: ghcr.io/jeremylong/open-vulnerability-data-mirror:latest
    entrypoint: [""]
  needs:
    - job: pages
      artifacts: true
  timeout: 30m
  variables:
    MIRROR_BASE: "https://nvd.epicsoft.one"
  before_script:
    - apk --no-cache upgrade
  script:
    # Poll until Pages serves the new cache.properties (the query string bypasses caches).
    - |
      want="$(grep '^lastModifiedDate=' public/cache.properties)"
      origin="${CI_PAGES_URL:-$MIRROR_BASE}/cache.properties?ci=${CI_PIPELINE_ID}"
      echo "waiting for the Pages deployment to serve: $want"
      i=0
      while [ "$i" -lt 60 ]; do
        got="$(curl -fsSL "$origin" 2>/dev/null | grep '^lastModifiedDate=' || true)"
        if [ "$got" = "$want" ]; then
          echo "live after $((i * 15))s"
          break
        fi
        i=$((i + 1))
        sleep 15
      done
      [ "$i" -lt 60 ] || { echo "ERROR: Pages is still not serving the new cache.properties after 15m" >&2; exit 1; }
  tags: [ "epicsoft" ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

trigger-dep-check:
  stage: trigger
  needs: [ "verify-published" ]
  trigger:
    project: epicsoft-networks/dependencycheck
    branch: main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
